[project]
name = "data-pipeline"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "unstructured[pdf]>=0.18.32",  # pdf parsing (OCR model)
    "pdfplumber>=0.11.10",         # pdf reader
    "fastembed>=0.8.0",            # embedding
    "qdrant-client>=1.19.0",
    "httpx>=0.28.1",               # llama-server client
    "pydantic-settings>=2.15.0",   # .env reader
]

[project.optional-dependencies]
dev = ["ruff>=0.16.10"]

[tool.setuptools.packages.find]
include = ["data_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",  
]