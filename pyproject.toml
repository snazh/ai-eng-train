[project]
name = "data-pipeline"
version = "0.1.0"
requires-python = ">=3.14"

[tool.setuptools.packages.find]
include = ["data_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes — неиспользуемые импорты и переменные, неопределённые имена
    "I",    # isort — порядок импортов
    "UP",   # pyupgrade — устаревшие конструкции
    "B",    # flake8-bugbear — подозрительные паттерны
    "SIM",  # flake8-simplify
]